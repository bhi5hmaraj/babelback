<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babelback: Synced Lyric Explorer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/css/phosphor.css" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PVPZ0KEKKW"></script>
  <script>
    // GA4 base setup with DebugView enablement in dev/local.
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    (function initGA(){
      const GA_ID = 'G-PVPZ0KEKKW';
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const qDebug = /([?&])debug_view=1(&|$)/.test(location.search);
      const lsDebug = (function(){ try { return localStorage.getItem('GA_DEBUG') === '1'; } catch { return false; } })();
      const debug = isLocal || qDebug || lsDebug;
      if (debug) { try { console.log('[ga] DebugView enabled'); } catch {}
      }
      gtag('js', new Date());
      // Only send debug_mode flag when enabled; otherwise send a minimal config
      const cfg = debug ? { debug_mode: true } : undefined;
      gtag('config', GA_ID, cfg);
    })();
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif; /* A nice default sans-serif font */
    }
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b; /* slate-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #475569; /* slate-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 */
    }

    /* HTML5 audio controls: high-contrast timeline and thumb */
    audio.audio-enhanced::-webkit-media-controls-panel {
      background-color: #334155; /* slate-700 */
      border-radius: 8px;
    }

    /* Custom range sliders (e.g., verse navigator) */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      height: 1.25rem; /* provide space for thumb */
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: #475569; /* slate-600 */
      border-radius: 9999px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px; /* align with track */
      border-radius: 9999px;
      background: #06b6d4; /* cyan-500 */
      border: 2px solid #e0f2fe;
      box-shadow: 0 0 0 2px rgba(2,132,199,0.25);
      cursor: pointer;
    }
    /* Firefox */
    input[type="range"]::-moz-range-track {
      height: 6px;
      background: #475569;
      border-radius: 9999px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      background: #06b6d4;
      border: 2px solid #e0f2fe;
      box-shadow: 0 0 0 2px rgba(2,132,199,0.25);
      cursor: pointer;
    }
    audio.audio-enhanced::-webkit-media-controls-timeline {
      background-color: #475569; /* slate-600 */
      border-radius: 9999px;
    }
    audio.audio-enhanced::-webkit-media-controls-current-time-display,
    audio.audio-enhanced::-webkit-media-controls-time-remaining-display {
      color: #e2e8f0; /* slate-200 */
    }
    /* Scrubber thumb for timeline and volume (WebKit/Blink) */
    audio.audio-enhanced::-webkit-media-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #06b6d4; /* cyan-500 */
      border: 2px solid #e0f2fe; /* light outline for contrast */
      border-radius: 9999px;
      box-shadow: 0 0 0 2px rgba(2,132,199,0.25); /* subtle glow */
      cursor: pointer;
    }
    /* Ensure icons are visible without global invert filters */
    audio.audio-enhanced::-webkit-media-controls-play-button,
    audio.audio-enhanced::-webkit-media-controls-mute-button,
    audio.audio-enhanced::-webkit-media-controls-volume-slider,
    audio.audio-enhanced::-webkit-media-controls-timeline,
    audio.audio-enhanced::-webkit-media-controls-time-remaining-display,
    audio.audio-enhanced::-webkit-media-controls-current-time-display {
      filter: none;
    }

    /* Styles for new VerseDisplay layout */
    .current-verse-display-wrapper { /* Applied to the main VerseDisplay container */
      border: 0;
      box-shadow: none;
    }

    .lyrics-scroll-container {
      height: 62vh; /* taller viewport to reduce scrolling */
      overflow-y: auto;
      padding: 6px;
      border: none;
      border-radius: 4px;
      background-color: transparent;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    .lyric-line-pair {
      padding: 2px 0;               /* densest */
      border: 0;
      margin-bottom: 4px;
      background-color: transparent;
      transition: none;
      width: 100%;
      max-width: 68ch; /* unify readable measure */
      margin-left: auto;
      margin-right: auto;
    }
    .lyric-line-pair + .lyric-line-pair { border-top: 1px solid #334155; padding-top: 4px; margin-top: 4px; }
    .lyric-line-pair:last-child {
      margin-bottom: 0;
    }
    
    .lyric-line-transliteration, 
    .lyric-line-translation {
      display: block; /* Ensure they are on new lines */
      color: #d1d5db; /* slate-300 */
      padding: 2px 0; /* Minimal vertical padding */
      line-height: 1.6;
      text-align: justify;           /* align both edges for easier scanning */
      text-justify: inter-word;      /* distribute space between words */
      word-break: normal;            /* do not break words by default */
      overflow-wrap: break-word;     /* only break extremely long tokens */
      hyphens: none;                 /* no auto-hyphenation */
    }
    .lyric-line-transliteration { font-size: 1.1rem; }
    .lyric-line-translation { font-size: 1rem; }
    .lyric-line-transliteration:not(:last-child) {
        margin-bottom: 2px; /* tighter space between translit and translat within a pair */
    }


    /* Lyric Segment Display Box Styling (individual lines) */
    .translit-segment, .translation-segment {
      /* display: block; Already handled by lyric-line-transliteration/translation */
      padding: 2px 0; /* compact */
      border-left: 3px solid transparent; /* constant width to avoid layout shift */
      border-radius: 0;
      transition: none;
    }

    /* New: per-word underline for transliteration (no boxes, no reflow) */
    .translit-word {
      display: inline-block;
      text-decoration: underline;
      text-decoration-color: #c084fc; /* purple */
      text-underline-offset: 2px;
      text-decoration-thickness: 1.5px;
    }

    /* Active Karaoke Mode Highlighting Styles for individual lines */
    .active-translit-segment {
      /* Non-resizing highlight: keep font metrics constant */
      background-color: rgba(126, 34, 206, 0.15) !important; /* subtle purple */
      border-left-color: #c084fc !important; /* purple accent */
      color: #f3e8ff !important;
    }
    .active-translit-segment .translit-word { text-decoration-color: #e9d5ff; }

    .active-translation-segment {
      background-color: rgba(109, 40, 217, 0.14) !important; /* subtle indigo */
      border-left-color: #a78bfa !important; /* indigo accent */
      color: #eef2ff !important;
    }
    /* No per-word underline for translation */

    /* --- Mobile quick wins (<= 640px) --- */
    @media (max-width: 640px) {
      .current-verse-display-wrapper { border-width: 1px; box-shadow: none; }
      .lyrics-scroll-container {
        height: 66vh; /* fixed on phones too */
        padding: 4px;
        border: none;
        background-color: transparent;
      }
      .lyric-line-pair { 
        border: none; 
        background-color: transparent; 
        padding: 2px 0; 
        margin-bottom: 6px; 
        max-width: 48ch; /* tighter measure on phones */
        position: relative;
      }
      .lyric-line-pair + .lyric-line-pair { 
        border-top: 1px solid #334155; /* clear demarcation between pairs */
        padding-top: 12px;
        margin-top: 12px; 
      }
      .translit-segment, .translation-segment { padding: 0; border-left-width: 3px; }
      .lyric-word { 
        display: inline; 
        padding: 0; 
        margin: 0 2px 0 0; 
        border: 0; 
        background: transparent; 
      }
      .lyric-line-transliteration { font-size: 20px; line-height: 1.68; }
      .lyric-line-translation { font-size: 17px; line-height: 1.68; color: #cbd5e1; }
      /* Active lines do not underline entire line; left accent + per-word underline in translit only */
      .active-translit-segment, .active-translation-segment { text-decoration: none; }
    }

  </style>
<!-- Removed importmap for react/react-dom to avoid duplicate React copies in dev (Invalid hook call). Vite bundles React from node_modules. -->
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
