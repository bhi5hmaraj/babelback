<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babelback: Synced Lyric Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/css/phosphor.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif; /* A nice default sans-serif font */
    }
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b; /* slate-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #475569; /* slate-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 */
    }

    /* Style for HTML5 audio player controls to make them more visible on dark backgrounds */
    audio::-webkit-media-controls-panel {
      background-color: #334155; /* slate-700, or a slightly lighter shade for contrast */
      border-radius: 8px; /* Match app's rounded corners */
    }
    audio::-webkit-media-controls-play-button,
    audio::-webkit-media-controls-timeline,
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display,
    audio::-webkit-media-controls-mute-button,
    audio::-webkit-media-controls-volume-slider,
    audio::-webkit-media-controls-fullscreen-button { /* Though fullscreen might not be typical for audio */
      filter: invert(1) brightness(1.5) contrast(1.5) saturate(0); /* Make icons white/light */
    }
     audio::-webkit-media-controls-timeline {
       background-color: #475569; /* slate-600 */
       border-radius: 4px;
     }
    /* Style the thumb (scrubber) on the timeline for WebKit browsers */
    audio::-webkit-media-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #0ea5e9; /* sky-500 */
        border-radius: 50%;
        cursor: pointer;
    }

    /* Lyric Display Box Styling */
    .translit-segment, .translation-segment {
      display: block; /* Each segment (line/phrase) takes its own line */
      margin-bottom: 8px; /* Space between line boxes */
      padding: 6px 8px; /* Padding for the line box */
      border: 1px solid #374151; /* slate-700 for line box border */
      border-radius: 6px; /* Rounded corners for the line box */
      transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out, border-color 0.2s ease-in-out;
      background-color: #1f2937; /* slate-800 slightly lighter for contrast with words */
    }

    .lyric-word {
      display: inline-block; /* Allow words to sit on the same line and wrap */
      padding: 3px 6px; /* Padding inside each word box */
      margin: 2px; /* Margin between word boxes */
      border: 1px solid #4b5563; /* slate-600 for word box border */
      border-radius: 4px; /* Rounded corners for word boxes */
      background-color: #374151; /* slate-700 for word box background */
      color: #d1d5db; /* slate-300 for default word text color */
      line-height: 1.5; /* Ensure word boxes have enough height and text is centered */
      transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out, border-color 0.2s ease-in-out;
    }

    /* Active Karaoke Mode Highlighting Styles */
    .active-translit-segment {
      font-weight: 700; /* Applied to line, words inherit or can be overridden */
      background-color: #7e22ce; /* Purple for translit line */
      border-color: #a855f7; /* Brighter purple border for active line */
      color: #f0e6ff; /* Text color for active line, words will inherit */
    }
    .active-translit-segment .lyric-word {
      background-color: #7e22ce; /* Match parent active background */
      border-color: #c084fc; /* Slightly lighter purple border for words */
      color: #f0e6ff; /* Ensure word text color matches active line */
    }

    .active-translation-segment {
      font-weight: 600; /* Applied to line */
      background-color: #6d28d9; /* Indigo for translation line */
      border-color: #8b5cf6; /* Brighter indigo border for active line */
      color: #eef2ff; /* Text color for active line */
    }
    .active-translation-segment .lyric-word {
      background-color: #6d28d9; /* Match parent active background */
      border-color: #a78bfa; /* Slightly lighter indigo border for words */
      color: #eef2ff; /* Ensure word text color matches active line */
    }

  </style>
<script type="importmap">
{

    "react/": "https://esm.sh/react@^19.1.0/",
