<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babelback: Synced Lyric Explorer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/css/phosphor.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif; /* A nice default sans-serif font */
    }
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b; /* slate-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #475569; /* slate-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 */
    }

    /* Style for HTML5 audio player controls to make them more visible on dark backgrounds */
    audio::-webkit-media-controls-panel {
      background-color: #334155; /* slate-700, or a slightly lighter shade for contrast */
      border-radius: 8px; /* Match app's rounded corners */
    }
    audio::-webkit-media-controls-play-button,
    audio::-webkit-media-controls-timeline,
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display,
    audio::-webkit-media-controls-mute-button,
    audio::-webkit-media-controls-volume-slider,
    audio::-webkit-media-controls-fullscreen-button { /* Though fullscreen might not be typical for audio */
      filter: invert(1) brightness(1.5) contrast(1.5) saturate(0); /* Make icons white/light */
    }
     audio::-webkit-media-controls-timeline {
       background-color: #475569; /* slate-600 */
       border-radius: 4px;
     }
    /* Style the thumb (scrubber) on the timeline for WebKit browsers */
    audio::-webkit-media-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #0ea5e9; /* sky-500 */
        border-radius: 50%;
        cursor: pointer;
    }

    /* Styles for new VerseDisplay layout */
    .current-verse-display-wrapper { /* Applied to the main VerseDisplay container */
      border: 0;
      box-shadow: none;
    }

    .lyrics-scroll-container {
      height: 62vh; /* taller viewport to reduce scrolling */
      overflow-y: auto;
      padding: 6px;
      border: none;
      border-radius: 4px;
      background-color: transparent;
    }

    .lyric-line-pair {
      padding: 2px 0;               /* densest */
      border: 0;
      margin-bottom: 4px;
      background-color: transparent;
      transition: none;
      width: 100%;
      max-width: 68ch; /* unify readable measure */
      margin-left: auto;
      margin-right: auto;
    }
    .lyric-line-pair + .lyric-line-pair { border-top: 1px solid #334155; padding-top: 4px; margin-top: 4px; }
    .lyric-line-pair:last-child {
      margin-bottom: 0;
    }
    
    .lyric-line-transliteration, 
    .lyric-line-translation {
      display: block; /* Ensure they are on new lines */
      color: #d1d5db; /* slate-300 */
      padding: 2px 0; /* Minimal vertical padding */
      line-height: 1.6;
      text-align: justify;           /* align both edges for easier scanning */
      text-justify: inter-word;      /* distribute space between words */
      word-break: normal;            /* do not break words by default */
      overflow-wrap: break-word;     /* only break extremely long tokens */
      hyphens: none;                 /* no auto-hyphenation */
    }
    .lyric-line-transliteration:not(:last-child) {
        margin-bottom: 2px; /* tighter space between translit and translat within a pair */
    }


    /* Lyric Segment Display Box Styling (individual lines) */
    .translit-segment, .translation-segment {
      /* display: block; Already handled by lyric-line-transliteration/translation */
      padding: 2px 0; /* compact */
      border-left: 3px solid transparent; /* constant width to avoid layout shift */
      border-radius: 0;
      transition: none;
    }

    /* New: per-word underline for transliteration (no boxes, no reflow) */
    .translit-word {
      display: inline;
      text-decoration: underline;
      text-decoration-color: #c084fc; /* purple */
      text-underline-offset: 2px;
      text-decoration-thickness: 1.5px;
    }

    /* Active Karaoke Mode Highlighting Styles for individual lines */
    .active-translit-segment {
      /* Non-resizing highlight: keep font metrics constant */
      background-color: rgba(126, 34, 206, 0.15) !important; /* subtle purple */
      border-left-color: #c084fc !important; /* purple accent */
      color: #f3e8ff !important;
    }
    .active-translit-segment .translit-word { text-decoration-color: #e9d5ff; }

    .active-translation-segment {
      background-color: rgba(109, 40, 217, 0.14) !important; /* subtle indigo */
      border-left-color: #a78bfa !important; /* indigo accent */
      color: #eef2ff !important;
    }
    /* No per-word underline for translation */

    /* --- Mobile quick wins (<= 640px) --- */
    @media (max-width: 640px) {
      .current-verse-display-wrapper { border-width: 1px; box-shadow: none; }
      .lyrics-scroll-container {
        height: 66vh; /* fixed on phones too */
        padding: 4px;
        border: none;
        background-color: transparent;
      }
      .lyric-line-pair { 
        border: none; 
        background-color: transparent; 
        padding: 2px 0; 
        margin-bottom: 6px; 
        max-width: 48ch; /* tighter measure on phones */
        position: relative;
      }
      .lyric-line-pair + .lyric-line-pair { 
        border-top: 1px solid #334155; /* clear demarcation between pairs */
        padding-top: 12px;
        margin-top: 12px; 
      }
      .translit-segment, .translation-segment { padding: 0; border-left-width: 3px; }
      .lyric-word { 
        display: inline; 
        padding: 0; 
        margin: 0 2px 0 0; 
        border: 0; 
        background: transparent; 
      }
      .lyric-line-transliteration { font-size: 18px; line-height: 1.65; }
      .lyric-line-translation { font-size: 16px; line-height: 1.65; color: #cbd5e1; }
      /* Active lines do not underline entire line; left accent + per-word underline in translit only */
      .active-translit-segment, .active-translation-segment { text-decoration: none; }
    }

  </style>
<!-- Removed importmap for react/react-dom to avoid duplicate React copies in dev (Invalid hook call). Vite bundles React from node_modules. -->
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
