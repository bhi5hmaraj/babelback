<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babelback: Synced Lyric Explorer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/css/phosphor.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif; /* A nice default sans-serif font */
    }
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b; /* slate-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #475569; /* slate-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 */
    }

    /* Style for HTML5 audio player controls to make them more visible on dark backgrounds */
    audio::-webkit-media-controls-panel {
      background-color: #334155; /* slate-700, or a slightly lighter shade for contrast */
      border-radius: 8px; /* Match app's rounded corners */
    }
    audio::-webkit-media-controls-play-button,
    audio::-webkit-media-controls-timeline,
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display,
    audio::-webkit-media-controls-mute-button,
    audio::-webkit-media-controls-volume-slider,
    audio::-webkit-media-controls-fullscreen-button { /* Though fullscreen might not be typical for audio */
      filter: invert(1) brightness(1.5) contrast(1.5) saturate(0); /* Make icons white/light */
    }
     audio::-webkit-media-controls-timeline {
       background-color: #475569; /* slate-600 */
       border-radius: 4px;
     }
    /* Style the thumb (scrubber) on the timeline for WebKit browsers */
    audio::-webkit-media-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #0ea5e9; /* sky-500 */
        border-radius: 50%;
        cursor: pointer;
    }

    /* Styles for new VerseDisplay layout */
    .current-verse-display-wrapper { /* Applied to the main VerseDisplay container */
      border: 2px solid #2dd4bf; /* teal-400 */
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.3);
    }

    .lyrics-scroll-container {
      max-height: 45vh; /* desktop/tablet default */
      overflow-y: auto;
      padding: 8px;
      border: 1px solid #374151; /* slate-700 */
      border-radius: 6px;
      background-color: #111827; /* Very dark blue-gray, almost black */
    }

    .lyric-line-pair {
      padding: 10px;
      border: 1px solid #4b5563; /* slate-600 */
      border-radius: 6px;
      margin-bottom: 12px;
      background-color: #1f2937; /* slate-800 */
      transition: box-shadow 0.2s ease-in-out;
    }
    .lyric-line-pair:last-child {
      margin-bottom: 0;
    }
    
    .lyric-line-transliteration, 
    .lyric-line-translation {
      display: block; /* Ensure they are on new lines */
      color: #d1d5db; /* slate-300 */
      padding: 2px 0; /* Minimal vertical padding */
      line-height: 1.6;
    }
    .lyric-line-transliteration:not(:last-child) {
        margin-bottom: 4px; /* Space between translit and translat within a pair */
    }


    /* Lyric Segment Display Box Styling (individual lines) */
    .translit-segment, .translation-segment {
      /* display: block; Already handled by lyric-line-transliteration/translation */
      /* margin-bottom: 8px; Removed, margin handled by lyric-line-pair */
      padding: 6px 8px; /* Padding for the line box content */
      border: 1px solid transparent; /* Default transparent border, active state will color it */
      border-radius: 4px; /* Slightly smaller radius for lines within pair */
      transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out, border-color 0.2s ease-in-out;
      /* background-color: #1f2937; Now on lyric-line-pair, active state will override for segment */
    }

    .lyric-word {
      display: inline-block; /* Allow words to sit on the same line and wrap */
      padding: 3px 6px; /* Padding inside each word box */
      margin: 2px; /* Margin between word boxes */
      border: 1px solid #4b5563; /* slate-600 for word box border */
      border-radius: 4px; /* Rounded corners for word boxes */
      background-color: #374151; /* slate-700 for word box background */
      color: #d1d5db; /* slate-300 for default word text color */
      line-height: 1.5; /* Ensure word boxes have enough height and text is centered */
      transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out, border-color 0.2s ease-in-out;
    }

    /* Active Karaoke Mode Highlighting Styles for individual lines */
    .active-translit-segment {
      font-weight: 700;
      background-color: #7e22ce !important; /* Purple for translit line */
      border-color: #a855f7 !important; /* Brighter purple border for active line */
      color: #f0e6ff !important; /* Text color for active line */
    }
    .active-translit-segment .lyric-word {
      background-color: #7e22ce; /* Match parent active background */
      border-color: #c084fc; /* Slightly lighter purple border for words */
      color: #f0e6ff; /* Ensure word text color matches active line */
    }

    .active-translation-segment {
      font-weight: 600;
      background-color: #6d28d9 !important; /* Indigo for translation line */
      border-color: #8b5cf6 !important; /* Brighter indigo border for active line */
      color: #eef2ff !important; /* Text color for active line */
    }
    .active-translation-segment .lyric-word {
      background-color: #6d28d9; /* Match parent active background */
      border-color: #a78bfa; /* Slightly lighter indigo border for words */
      color: #eef2ff; /* Ensure word text color matches active line */
    }

    /* --- Mobile quick wins (<= 640px) --- */
    @media (max-width: 640px) {
      .current-verse-display-wrapper { border-width: 1px; box-shadow: none; }
      .lyrics-scroll-container {
        max-height: 72vh; /* make lyrics dominant on phones */
        padding: 4px;
        border: none;
        background-color: transparent;
      }
      .lyric-line-pair { 
        border: none; 
        background-color: transparent; 
        padding: 6px 0; 
        margin-bottom: 8px; 
      }
      .translit-segment, .translation-segment { padding: 0; border: none; }
      .lyric-word { 
        display: inline; 
        padding: 0; 
        margin: 0 2px 0 0; 
        border: 0; 
        background: transparent; 
      }
      .lyric-line-transliteration, .lyric-line-translation { font-size: 18px; line-height: 1.65; }
      .active-translit-segment, .active-translation-segment { 
        background: transparent !important; 
        border-color: transparent !important; 
        font-size: 22px; 
      }
      .active-translit-segment .lyric-word { text-decoration: underline; text-decoration-color: #c084fc; text-underline-offset: 3px; }
      .active-translation-segment .lyric-word { text-decoration: underline; text-decoration-color: #a78bfa; text-underline-offset: 3px; }
    }

  </style>
<!-- Removed importmap for react/react-dom to avoid duplicate React copies in dev (Invalid hook call). Vite bundles React from node_modules. -->
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
