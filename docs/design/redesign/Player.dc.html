<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player: Saheba</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.body}}; display: flex; flex-direction: column; overflow: hidden">
  <sc-if value="{{t.retro}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 0">
      <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 34px; display: flex; align-items: center; justify-content: center; background: {{t.raised}}; box-shadow: {{t.raise}}; color: {{t.text}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span aria-hidden="true" style="flex: 1; height: 7px; background: repeating-linear-gradient(to bottom, #6E7390 0px, #6E7390 1px, transparent 1px, transparent 3px)"></span>
      <span style="font-family: {{t.display}}; font-size: 20px; letter-spacing: 0.24em; color: {{t.soft}}">BABELBACK</span>
      <span aria-hidden="true" style="flex: 1; height: 7px; background: repeating-linear-gradient(to bottom, #6E7390 0px, #6E7390 1px, transparent 1px, transparent 3px)"></span>
      <button type="button" aria-label="Translation language: English" style="height: 34px; padding: 0 10px; border: 0; background: {{t.raised}}; box-shadow: {{t.raise}}; color: {{t.text}}; font-family: {{t.display}}; font-size: 20px; cursor: pointer">EN</button>
    </div>
    <div style="margin: 10px 12px 0; padding: 10px 12px; background: {{t.panel}}; box-shadow: {{t.sink}}; display: flex; gap: 14px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: {{t.display}}; font-size: 48px; line-height: 0.9; color: {{t.lyric}}">{{now}}</span>
        <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 20px">
          <sc-for list="{{spectrum}}" as="h" hint-placeholder-count="14">
            <span style="width: 4px; height: {{h}}px; background: {{t.lyric}}"></span>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-family: {{t.display}}; color: {{t.lyric}}">
        <span style="font-size: 23px; white-space: nowrap; overflow: hidden">1. SAHEBA *** HINDI TO ENGLISH ***</span>
        <span style="font-size: 19px; color: {{t.faint}}; text-transform: uppercase">Line {{lineLabel}}</span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{t.modern}}" hint-placeholder-val="{{ true }}">
    <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px">
      <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: {{t.text}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
        <span style="font-family: {{t.display}}; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Saheba</span>
        <span style="font-size: 13px; color: {{t.muted}}">Hindi, translated to English</span>
      </div>
      <button type="button" style="height: 44px; padding: 0 12px 0 14px; border-radius: {{t.pill}}px; background: {{t.surface}}; border: 1px solid {{t.line}}; color: {{t.text}}; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
        English
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </header>
  </sc-if>

  <div role="group" aria-label="Show on each line" style="display: flex; gap: 8px; padding: 10px 20px 12px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}" style="height: 36px; padding: 0 14px; border-radius: {{t.pill}}px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.shadow}}; font-family: {{t.chipFont}}; font-size: {{t.chipSize}}px; font-weight: 600; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; margin: 0 12px; padding: {{panelPad}}; background: {{t.panel}}; box-shadow: {{t.sink}}; border-radius: {{t.small}}px; overflow: hidden">
    <sc-for list="{{verses}}" as="v" hint-placeholder-count="6">
      <button type="button" onClick="{{v.pick}}" aria-current="{{v.current}}" style="display: flex; flex-direction: column; gap: {{v.gap}}px; width: 100%; box-sizing: border-box; text-align: left; padding: {{v.pad}}; border: 0; border-radius: {{t.radius}}px; background: {{v.bg}}; font-family: inherit; cursor: pointer">
        <sc-if value="{{showScript}}" hint-placeholder-val="{{ true }}">
          <span lang="hi" style="font-size: {{v.scriptSize}}px; line-height: 1.45; color: {{v.scriptColor}}; white-space: pre-line">{{v.original}}</span>
        </sc-if>
        <sc-if value="{{showSound}}" hint-placeholder-val="{{ true }}">
          <span style="font-family: {{t.lcd}}; font-size: {{v.smallSize}}px; line-height: 1.35; font-style: {{t.soundStyle}}; color: {{v.soundColor}}">{{v.sound}}</span>
        </sc-if>
        <sc-if value="{{showMeaning}}" hint-placeholder-val="{{ true }}">
          <span style="font-family: {{t.lcd}}; font-size: {{v.smallSize}}px; line-height: 1.35; color: {{v.meaningColor}}">{{v.meaning}}</span>
        </sc-if>
      </button>
      <sc-if value="{{v.isActive}}" hint-placeholder-val="{{ false }}">
        <a href="Verse.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; font-family: {{t.chipFont}}; font-size: {{t.chipSize}}px; font-weight: 600; color: {{t.ink}}; text-decoration: none">
          What this line means
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-if>
    </sc-for>
  </div>

  <section aria-label="Playback" style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px; padding: 14px 20px 26px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; box-shadow: {{t.raise}}">
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 2px; height: 12px">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="17">
        <div style="flex: {{s.flex}} 1 0px; height: {{s.height}}px; border-radius: {{segRadius}}px; background: {{s.color}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: {{t.lcd}}; font-size: {{t.numSize}}px; color: {{t.muted}}; font-variant-numeric: tabular-nums">
      <span>{{now}}</span>
      <span>Line {{lineLabel}}</span>
      <span>2:51</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Loop this line" aria-pressed="{{loopPressed}}" onClick="{{toggleLoop}}" style="width: 48px; height: 48px; border-radius: {{t.pill}}px; border: 0; background: {{loopBg}}; color: {{loopFg}}; box-shadow: {{loopShadow}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path></svg>
      </button>
      <button type="button" aria-label="Previous line" onClick="{{prev}}" style="width: 52px; height: 52px; border-radius: {{t.pill}}px; border: 0; background: {{navBg}}; color: {{t.text}}; box-shadow: {{t.raise}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.5v13L9.5 12z" fill="currentColor"></path></svg>
      </button>
      <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 72px; height: 72px; border-radius: {{t.pill}}px; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; box-shadow: {{t.raise}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
          <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg>
        </sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
          <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg>
        </sc-if>
      </button>
      <button type="button" aria-label="Next line" onClick="{{next}}" style="width: 52px; height: 52px; border-radius: {{t.pill}}px; border: 0; background: {{navBg}}; color: {{t.text}}; box-shadow: {{t.raise}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.5v13L14.5 12z" fill="currentColor"></path></svg>
      </button>
      <a href="Practice.dc.html" aria-label="Practise this line" style="width: 48px; height: 48px; border-radius: {{t.pill}}px; background: {{t.raised}}; color: {{t.text}}; box-shadow: {{t.raise}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day","retro"],"default":"night"},"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#7DD3C0","#F28C6B","#F2D13A","#3CFF5A"]},"$preview":{"width":390,"height":844}}'>
const BODY = "Figtree, 'Noto Sans Devanagari', 'Noto Sans Tamil', system-ui, sans-serif";
const THEMES = {
  night: {
    accent: '#F5B83D', dark: true,
    bg: '#0E1014', surface: '#171A20', raised: '#20242C', line: '#2A2F38', edge: '#3A404B',
    text: '#F3F1EC', soft: '#D5D8DE', muted: '#A3A9B4', faint: '#7C8390',
    panel: '#0E1014', lyric: '#C3C7CF', lyricNow: '#F3F1EC', onAccent: '#1A1408',
    scrim: 'rgba(5, 6, 8, 0.6)', err: '#FF9A80', errBg: '#2A1714',
    radius: 20, pill: 999, raise: 'none', sink: 'none',
    display: "'Bricolage Grotesque', Figtree, sans-serif", body: BODY, lcd: BODY,
  },
  day: {
    accent: '#F5B83D', dark: false,
    bg: '#F4F5F7', surface: '#FFFFFF', raised: '#E9EBEF', line: '#D5D9E0', edge: '#B8BEC8',
    text: '#15171C', soft: '#2E3239', muted: '#5A606A', faint: '#6A707A',
    panel: '#F4F5F7', lyric: '#2E3239', lyricNow: '#15171C', onAccent: '#1A1408',
    scrim: 'rgba(20, 22, 28, 0.35)', err: '#B3361B', errBg: '#FBE3DC',
    radius: 20, pill: 999, raise: 'none', sink: 'none',
    display: "'Bricolage Grotesque', Figtree, sans-serif", body: BODY, lcd: BODY,
  },
  retro: {
    accent: '#F2D13A', dark: true,
    bg: '#1B1D2A', surface: '#2A2D3E', raised: '#3A3E54', line: '#0A0B10', edge: '#0A0B10',
    text: '#E6E8F0', soft: '#C9CCD8', muted: '#9EA3B8', faint: '#1FA33C',
    panel: '#000000', lyric: '#3CFF5A', lyricNow: '#FFFFFF', onAccent: '#14140A',
    scrim: 'rgba(0, 0, 0, 0.55)', err: '#FF6A5A', errBg: '#000000',
    radius: 2, pill: 2,
    raise: 'inset 1px 1px 0 #6E7390, inset -1px -1px 0 #08090E',
    sink: 'inset 1px 1px 0 #08090E, inset -1px -1px 0 #4A4F68',
    display: "VT323, 'Courier New', monospace", body: BODY,
    lcd: "VT323, 'Noto Sans Devanagari', 'Noto Sans Tamil', monospace",
  },
};

function soft(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function shade(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  const c = (v) => Math.round(v * factor);
  return `rgb(${c((n >> 16) & 255)}, ${c((n >> 8) & 255)}, ${c(n & 255)})`;
}

function themeFor(props) {
  const retro = props.theme === 'retro';
  const base = THEMES[props.theme] ?? THEMES.night;
  const accent = props.accent ?? base.accent;
  return {
    ...base,
    accent,
    retro,
    modern: !retro,
    ink: base.dark ? accent : shade(accent, 0.55),
    tint: soft(accent, 0.14),
    tintLine: soft(accent, 0.5),
    small: retro ? 2 : 12,
    sheetRadius: retro ? '2px 2px 0 0' : '28px 28px 0 0',
    boost: retro ? 4 : 0,
    chipFont: retro ? base.display : 'inherit',
    chipSize: retro ? 19 : 14,
    numSize: retro ? 18 : 13,
    soundStyle: retro ? 'normal' : 'italic',
  };
}

const TIMES = [[12, 21], [22, 31], [32, 41], [41, 50], [50, 60], [60, 70], [70, 78], [79, 89], [103, 112], [113, 121], [122, 131], [132, 141], [142, 150], [151, 161], [161, 171]];
const SPECTRUM = [8, 14, 20, 16, 11, 18, 20, 13, 9, 15, 12, 7, 10, 5];

const LINES = [
  {
    original: 'साहिबा आए घर काहे ना, ऐसे तो सताए ना\nदेखूं तुझको चैन आता है',
    sound: 'Sah-heh-bah ah-yeh ghur kah-heh nah, eh-seh toh sah-tah-yeh nah.',
    meaning: "My love, why don't you come home? Don't torture me like this.",
  },
  {
    original: 'साहिबा नींदें विंदें आए ना, रातें काटी जाए ना\nतेरा ही ख्याल दिन रैन आता है',
    sound: 'Sah-heh-bah neen-dein veen-dein ah-yeh nah, rah-tein kah-tee jah-yeh nah.',
    meaning: "My love, sleep just won't come, and the nights are impossible to get through.",
  },
  {
    original: 'साहिबा समंदर मेरी आँखों में रह गए\nहम आते आते जाना, तेरी यादों में रह गए',
    sound: 'Sah-heh-bah sah-mun-dur meh-ree ahn-khon mein reh geh-yeh. Hum ah-teh ah-teh jah-nah, teh-ree yah-don mein reh geh-yeh.',
    meaning: 'My love, oceans have been left in my eyes. I was on my way, my dear, but got lost in memories of you.',
  },
  {
    original: 'ये पलकें गवाही है, हम रातों में रह गए\nजो वादे किए सारे, बस बातों में रह गए',
    sound: 'Yeh pul-kein gah-wah-hee heh, hum rah-ton mein reh geh-yeh.',
    meaning: "These eyelids are the proof, we've been left behind in the nights.",
  },
  {
    original: 'बातों बातों में ही, ख्वाबों ख्वाबों में ही, मेरे करीब है तू',
    sound: 'Bah-ton bah-ton mein hee, khwah-bon khwah-bon mein hee, meh-reh kah-reeb heh too.',
    meaning: 'Only in conversations, only in dreams, are you close to me.',
  },
  {
    original: 'शोर ओ शराबा जो सीने में है मेरे, कैसे बयां मैं करूँ',
    sound: 'Shor o shah-rah-bah jo see-neh mein heh meh-reh, keh-seh bah-yan mein kah-roon.',
    meaning: 'The chaos and noise inside my chest, how can I even explain it?',
  },
];

function clock(seconds) {
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 2, playing: true, loop: false, script: true, sound: true, meaning: true };
  }

  renderVals() {
    const t = themeFor(this.props);
    const { active, playing, loop } = this.state;
    const go = (index) => this.setState({ active: Math.max(0, Math.min(LINES.length - 1, index)) });

    const verses = LINES.map((line, index) => {
      const isActive = index === active;
      const isPast = index < active;
      const upcoming = t.retro ? t.lyric : t.muted;
      return {
        ...line,
        isActive,
        current: isActive ? 'true' : 'false',
        pick: () => go(index),
        bg: isActive ? soft(t.accent, t.retro ? 0.18 : 0.12) : 'transparent',
        pad: isActive ? '16px 18px' : '8px 18px',
        gap: isActive ? 6 : 2,
        scriptSize: isActive ? 25 : 18,
        smallSize: (isActive ? 16 : 14) + t.boost,
        scriptColor: isActive ? t.lyricNow : isPast ? t.faint : t.lyric,
        soundColor: isActive ? t.ink : isPast ? t.faint : upcoming,
        meaningColor: isActive ? (t.retro ? t.lyricNow : t.soft) : isPast ? t.faint : upcoming,
      };
    });

    const segments = [];
    let cursor = 0;
    TIMES.forEach(([start, end], index) => {
      if (start > cursor) segments.push({ flex: start - cursor, height: 2, color: t.line });
      segments.push({
        flex: end - start,
        height: index === active ? 12 : 6,
        color: index <= active ? t.accent : t.retro ? '#4A4F68' : t.edge,
      });
      cursor = end;
    });

    const chip = (key, label) => {
      const on = this.state[key];
      return {
        label: t.retro ? label.toUpperCase() : label,
        pressed: on ? 'true' : 'false',
        toggle: () => this.setState({ [key]: !on }),
        bg: on ? t.tint : t.retro ? t.raised : 'transparent',
        fg: on ? t.ink : t.muted,
        border: t.retro ? 'transparent' : on ? t.tintLine : t.line,
        shadow: on ? t.sink : t.raise,
      };
    };

    return {
      t,
      verses,
      segments,
      spectrum: SPECTRUM,
      chips: [chip('script', 'Script'), chip('sound', 'Sounds like'), chip('meaning', 'Meaning')],
      showScript: this.state.script,
      showSound: this.state.sound,
      showMeaning: this.state.meaning,
      panelPad: t.retro ? '8px 0' : '0',
      segRadius: t.retro ? 0 : 3,
      navBg: t.retro ? t.raised : 'transparent',
      now: clock(TIMES[active][0] + 4),
      lineLabel: `${active + 1} of ${TIMES.length}`,
      playing,
      paused: !playing,
      playLabel: playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !playing }),
      prev: () => go(active - 1),
      next: () => go(active + 1),
      loopPressed: loop ? 'true' : 'false',
      loopBg: loop ? t.tint : t.retro ? t.raised : 'transparent',
      loopFg: loop ? t.ink : t.muted,
      loopShadow: loop ? t.sink : t.raise,
      toggleLoop: () => this.setState({ loop: !loop }),
    };
  }
}
</script>
</body>
</html>
