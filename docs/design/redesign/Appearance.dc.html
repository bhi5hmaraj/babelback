<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.body}}; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: {{t.pill}}px; background: {{backBg}}; box-shadow: {{t.raise}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: {{t.display}}; font-size: {{titleSize}}px; font-weight: 700; letter-spacing: -0.01em">Appearance</h1>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 10px 20px 24px; overflow: hidden">
    <section aria-label="Preview" style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: {{t.radius}}px; background: {{t.surface}}; box-shadow: {{t.raise}}">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: {{panelPad}}; background: {{t.panel}}; box-shadow: {{t.sink}}; border-radius: {{t.small}}px">
        <span lang="hi" style="padding: 0 12px; font-size: 15px; color: {{t.faint}}">साहिबा नींदें विंदें आए ना</span>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: {{t.small}}px; background: {{activeBg}}">
          <span lang="hi" style="font-size: 20px; line-height: 1.4; font-weight: 600; color: {{t.lyricNow}}">साहिबा समंदर मेरी आँखों में रह गए</span>
          <span style="font-family: {{t.lcd}}; font-size: {{soundSize}}px; font-style: {{t.soundStyle}}; color: {{t.ink}}">Sah-heh-bah sah-mun-dur meh-ree ahn-khon</span>
        </div>
        <span lang="hi" style="padding: 0 12px; font-size: 15px; color: {{t.lyric}}">ये पलकें गवाही है</span>
      </div>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 2px; height: 10px">
        <sc-for list="{{segments}}" as="s" hint-placeholder-count="10">
          <span style="flex: 1 1 0px; height: {{s.height}}px; border-radius: {{segRadius}}px; background: {{s.color}}"></span>
        </sc-for>
      </div>
      <div aria-hidden="true" style="display: flex; align-items: center; justify-content: center; gap: 18px">
        <span style="width: 40px; height: 40px; border-radius: {{t.pill}}px; background: {{navBg}}; box-shadow: {{t.raise}}; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5.5v13L9.5 12z" fill="currentColor"></path></svg>
        </span>
        <span style="width: 56px; height: 56px; border-radius: {{t.pill}}px; background: {{t.accent}}; color: {{t.onAccent}}; box-shadow: {{t.raise}}; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg>
        </span>
        <span style="width: 40px; height: 40px; border-radius: {{t.pill}}px; background: {{navBg}}; box-shadow: {{t.raise}}; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5.5v13L14.5 12z" fill="currentColor"></path></svg>
        </span>
      </div>
    </section>

    <section role="group" aria-label="Theme" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: {{t.chipFont}}; font-size: {{labelSize}}px; font-weight: 600; color: {{t.muted}}; letter-spacing: 0.04em; text-transform: uppercase">Theme</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{themes}}" as="th" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{th.pressed}}" onClick="{{th.pick}}" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: {{cardRadius}}px; border: {{th.borderWidth}}px solid {{th.border}}; background: {{t.surface}}; box-shadow: {{th.shadow}}; color: {{t.text}}; cursor: pointer">
            <span aria-hidden="true" style="height: 58px; border-radius: {{th.radius}}px; background: {{th.bg}}; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 8px; box-sizing: border-box">
              <span style="height: 8px; width: 70%; border-radius: 4px; background: {{th.line}}"></span>
              <span style="display: flex; align-items: center; justify-content: space-between">
                <span style="height: 8px; width: 45%; border-radius: 4px; background: {{th.surface}}"></span>
                <span style="width: 18px; height: 18px; border-radius: {{th.dotRadius}}px; background: {{th.dot}}"></span>
              </span>
            </span>
            <span style="font-size: 14px; font-weight: 600">{{th.name}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section role="group" aria-label="Button colour" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-family: {{t.chipFont}}; font-size: {{labelSize}}px; font-weight: 600; color: {{t.muted}}; letter-spacing: 0.04em; text-transform: uppercase">Button colour</h2>
        <span style="font-size: 14px; color: {{t.soft}}">{{accentName}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; justify-items: center">
        <sc-for list="{{accents}}" as="a" hint-placeholder-count="7">
          <button type="button" aria-label="{{a.name}}" aria-pressed="{{a.pressed}}" onClick="{{a.pick}}" style="width: 44px; height: 44px; border-radius: {{t.pill}}px; border: 0; background: {{a.hex}}; color: {{t.onAccent}}; box-shadow: {{a.ring}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <sc-if value="{{a.on}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <button type="button" onClick="{{resetAccent}}" style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: {{t.ink}}; font-size: 15px; font-weight: 600; cursor: pointer">Use the theme's own colour</button>
    </section>

    <p style="margin: auto 0 0; font-size: 13px; line-height: 1.5; color: {{t.muted}}; text-align: center">Saved to your account, so your phone, tablet and the web match.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day","retro"],"default":"night"},"$preview":{"width":390,"height":844}}'>
const BODY = "Figtree, 'Noto Sans Devanagari', 'Noto Sans Tamil', system-ui, sans-serif";
const THEMES = {
  night: {
    accent: '#F5B83D', dark: true,
    bg: '#0E1014', surface: '#171A20', raised: '#20242C', line: '#2A2F38', edge: '#3A404B',
    text: '#F3F1EC', soft: '#D5D8DE', muted: '#A3A9B4', faint: '#7C8390',
    panel: '#0E1014', lyric: '#C3C7CF', lyricNow: '#F3F1EC', onAccent: '#1A1408',
    scrim: 'rgba(5, 6, 8, 0.6)', err: '#FF9A80', errBg: '#2A1714',
    radius: 20, pill: 999, raise: 'none', sink: 'none',
    display: "'Bricolage Grotesque', Figtree, sans-serif", body: BODY, lcd: BODY,
  },
  day: {
    accent: '#F5B83D', dark: false,
    bg: '#F4F5F7', surface: '#FFFFFF', raised: '#E9EBEF', line: '#D5D9E0', edge: '#B8BEC8',
    text: '#15171C', soft: '#2E3239', muted: '#5A606A', faint: '#6A707A',
    panel: '#F4F5F7', lyric: '#2E3239', lyricNow: '#15171C', onAccent: '#1A1408',
    scrim: 'rgba(20, 22, 28, 0.35)', err: '#B3361B', errBg: '#FBE3DC',
    radius: 20, pill: 999, raise: 'none', sink: 'none',
    display: "'Bricolage Grotesque', Figtree, sans-serif", body: BODY, lcd: BODY,
  },
  retro: {
    accent: '#F2D13A', dark: true,
    bg: '#1B1D2A', surface: '#2A2D3E', raised: '#3A3E54', line: '#0A0B10', edge: '#0A0B10',
    text: '#E6E8F0', soft: '#C9CCD8', muted: '#9EA3B8', faint: '#1FA33C',
    panel: '#000000', lyric: '#3CFF5A', lyricNow: '#FFFFFF', onAccent: '#14140A',
    scrim: 'rgba(0, 0, 0, 0.55)', err: '#FF6A5A', errBg: '#000000',
    radius: 2, pill: 2,
    raise: 'inset 1px 1px 0 #6E7390, inset -1px -1px 0 #08090E',
    sink: 'inset 1px 1px 0 #08090E, inset -1px -1px 0 #4A4F68',
    display: "VT323, 'Courier New', monospace", body: BODY,
    lcd: "VT323, 'Noto Sans Devanagari', 'Noto Sans Tamil', monospace",
  },
};

function soft(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function shade(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  const c = (v) => Math.round(v * factor);
  return `rgb(${c((n >> 16) & 255)}, ${c((n >> 8) & 255)}, ${c(n & 255)})`;
}

function themeFor(props) {
  const retro = props.theme === 'retro';
  const base = THEMES[props.theme] ?? THEMES.night;
  const accent = props.accent ?? base.accent;
  return {
    ...base,
    accent,
    retro,
    modern: !retro,
    ink: base.dark ? accent : shade(accent, 0.55),
    tint: soft(accent, 0.14),
    tintLine: soft(accent, 0.5),
    small: retro ? 2 : 12,
    sheetRadius: retro ? '2px 2px 0 0' : '28px 28px 0 0',
    boost: retro ? 4 : 0,
    chipFont: retro ? base.display : 'inherit',
    chipSize: retro ? 19 : 14,
    numSize: retro ? 18 : 13,
    soundStyle: retro ? 'normal' : 'italic',
  };
}

const ACCENTS = [
  { hex: '#F5B83D', name: 'Marigold' },
  { hex: '#F2D13A', name: 'Lemon' },
  { hex: '#F28C6B', name: 'Coral' },
  { hex: '#7DD3C0', name: 'Mint' },
  { hex: '#8FC7FF', name: 'Sky' },
  { hex: '#B9A6FF', name: 'Lilac' },
  { hex: '#3CFF5A', name: 'Phosphor' },
];

const THEME_NAMES = { night: 'Night', day: 'Day', retro: 'Retro deck' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: props.theme ?? 'night', accent: null };
  }

  renderVals() {
    const { theme, accent } = this.state;
    const t = themeFor({ theme, accent: accent ?? undefined });
    const chosen = accent ?? THEMES[theme].accent;

    const themes = Object.keys(THEME_NAMES).map((id) => {
      const on = id === theme;
      const look = THEMES[id];
      return {
        id,
        name: THEME_NAMES[id],
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ theme: id }),
        bg: look.bg,
        line: look.line,
        surface: look.surface,
        dot: accent ?? look.accent,
        radius: id === 'retro' ? 0 : 10,
        dotRadius: id === 'retro' ? 0 : 9,
        border: on ? t.ink : t.line,
        borderWidth: on ? 2 : 1,
        shadow: on ? t.sink : t.raise,
      };
    });

    const accents = ACCENTS.map((a) => {
      const on = a.hex === chosen;
      return {
        ...a,
        on,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ accent: a.hex }),
        ring: on ? `0 0 0 3px ${t.bg}, 0 0 0 5px ${t.text}` : t.raise,
      };
    });

    const segments = Array.from({ length: 10 }, (_, index) => ({
      height: index === 3 ? 10 : 5,
      color: index <= 3 ? t.accent : t.retro ? '#4A4F68' : t.edge,
    }));

    return {
      t,
      themes,
      accents,
      segments,
      accentName: (ACCENTS.find((a) => a.hex === chosen) ?? { name: 'Custom' }).name,
      resetAccent: () => this.setState({ accent: null }),
      titleSize: t.retro ? 28 : 22,
      labelSize: t.retro ? 18 : 13,
      backBg: t.retro ? t.raised : 'transparent',
      panelPad: t.retro ? '8px 0' : '4px 0',
      activeBg: soft(t.accent, t.retro ? 0.18 : 0.12),
      soundSize: t.retro ? 18 : 14,
      segRadius: t.retro ? 0 : 3,
      navBg: t.retro ? t.raised : 'transparent',
      cardRadius: t.retro ? 2 : 16,
    };
  }
}
</script>
</body>
</html>
