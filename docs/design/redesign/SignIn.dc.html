<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.body}}; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 76px 20px 0; font-family: {{t.display}}; font-size: 30px; font-weight: 700; line-height: 1.1; color: {{t.muted}}">What are we<br>listening to?</div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

  <section role="dialog" aria-label="Sign in" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; box-sizing: border-box; background: {{t.surface}}; box-shadow: {{t.raise}}; border-radius: {{t.sheetRadius}}; padding: 10px 20px 26px; display: flex; flex-direction: column; gap: 20px">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{t.edge}}"></div>
    <div style="display: flex; justify-content: flex-end; margin: -10px -8px -14px 0">
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: {{t.pill}}px; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: {{t.display}}; font-size: {{headSize}}px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em">Sign in to add<br>your own songs</h1>
      <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 16px; color: {{t.soft}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>
        You start with 40 free credits.
      </p>
    </div>

    <dl style="margin: 0; display: flex; flex-direction: column; border-radius: {{listRadius}}px; background: {{listBg}}; box-shadow: {{t.sink}}; padding: 4px 16px; font-family: {{t.lcd}}; font-size: {{rowSize}}px; color: {{rowColor}}">
      <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid {{t.line}}">
        <dt>Add a YouTube song</dt>
        <dd style="margin: 0; font-weight: 600">8</dd>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid {{t.line}}">
        <dt>Upload a song, or add a language</dt>
        <dd style="margin: 0; font-weight: 600">5</dd>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 12px 0">
        <dt>Score a practice line</dt>
        <dd style="margin: 0; font-weight: 600">1</dd>
      </div>
    </dl>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="height: 54px; border-radius: {{t.pill}}px; border: 0; background: {{t.text}}; color: {{t.bg}}; box-shadow: {{t.raise}}; font-size: 16px; font-weight: 700; cursor: pointer">Continue with Google</button>
      <button type="button" style="height: 54px; border-radius: {{t.pill}}px; border: 1px solid {{outline}}; background: {{outlineBg}}; color: {{t.text}}; box-shadow: {{t.raise}}; font-size: 16px; font-weight: 600; cursor: pointer">Continue with Apple</button>
      <button type="button" style="height: 54px; border-radius: {{t.pill}}px; border: 1px solid {{outline}}; background: {{outlineBg}}; color: {{t.text}}; box-shadow: {{t.raise}}; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
        Email me a code
      </button>
    </div>

    <p style="margin: auto 0 0; font-size: 13px; line-height: 1.5; color: {{t.muted}}; text-align: center">The sample songs stay free without an account.<br>By continuing you agree to the <a href="#terms" style="color: {{t.soft}}">Terms</a> and <a href="#privacy" style="color: {{t.soft}}">Privacy policy</a>.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day","retro"],"default":"night"},"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#7DD3C0","#F28C6B","#F2D13A","#3CFF5A"]},"$preview":{"width":390,"height":844}}'>
const BODY = "Figtree, 'Noto Sans Devanagari', 'Noto Sans Tamil', system-ui, sans-serif";
const THEMES = {
  night: {
    accent: '#F5B83D', dark: true,
    bg: '#0E1014', surface: '#171A20', raised: '#20242C', line: '#2A2F38', edge: '#3A404B',
    text: '#F3F1EC', soft: '#D5D8DE', muted: '#A3A9B4', faint: '#7C8390',
    panel: '#0E1014', lyric: '#C3C7CF', lyricNow: '#F3F1EC', onAccent: '#1A1408',
    scrim: 'rgba(5, 6, 8, 0.6)', err: '#FF9A80', errBg: '#2A1714',
    radius: 20, pill: 999, raise: 'none', sink: 'none',
    display: "'Bricolage Grotesque', Figtree, sans-serif", body: BODY, lcd: BODY,
  },
  day: {
    accent: '#F5B83D', dark: false,
    bg: '#F4F5F7', surface: '#FFFFFF', raised: '#E9EBEF', line: '#D5D9E0', edge: '#B8BEC8',
    text: '#15171C', soft: '#2E3239', muted: '#5A606A', faint: '#6A707A',
    panel: '#F4F5F7', lyric: '#2E3239', lyricNow: '#15171C', onAccent: '#1A1408',
    scrim: 'rgba(20, 22, 28, 0.35)', err: '#B3361B', errBg: '#FBE3DC',
    radius: 20, pill: 999, raise: 'none', sink: 'none',
    display: "'Bricolage Grotesque', Figtree, sans-serif", body: BODY, lcd: BODY,
  },
  retro: {
    accent: '#F2D13A', dark: true,
    bg: '#1B1D2A', surface: '#2A2D3E', raised: '#3A3E54', line: '#0A0B10', edge: '#0A0B10',
    text: '#E6E8F0', soft: '#C9CCD8', muted: '#9EA3B8', faint: '#1FA33C',
    panel: '#000000', lyric: '#3CFF5A', lyricNow: '#FFFFFF', onAccent: '#14140A',
    scrim: 'rgba(0, 0, 0, 0.55)', err: '#FF6A5A', errBg: '#000000',
    radius: 2, pill: 2,
    raise: 'inset 1px 1px 0 #6E7390, inset -1px -1px 0 #08090E',
    sink: 'inset 1px 1px 0 #08090E, inset -1px -1px 0 #4A4F68',
    display: "VT323, 'Courier New', monospace", body: BODY,
    lcd: "VT323, 'Noto Sans Devanagari', 'Noto Sans Tamil', monospace",
  },
};

function soft(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function shade(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  const c = (v) => Math.round(v * factor);
  return `rgb(${c((n >> 16) & 255)}, ${c((n >> 8) & 255)}, ${c(n & 255)})`;
}

function themeFor(props) {
  const retro = props.theme === 'retro';
  const base = THEMES[props.theme] ?? THEMES.night;
  const accent = props.accent ?? base.accent;
  return {
    ...base,
    accent,
    retro,
    modern: !retro,
    ink: base.dark ? accent : shade(accent, 0.55),
    tint: soft(accent, 0.14),
    tintLine: soft(accent, 0.5),
    small: retro ? 2 : 12,
    sheetRadius: retro ? '2px 2px 0 0' : '28px 28px 0 0',
    boost: retro ? 4 : 0,
    chipFont: retro ? base.display : 'inherit',
    chipSize: retro ? 19 : 14,
    numSize: retro ? 18 : 13,
    soundStyle: retro ? 'normal' : 'italic',
  };
}

class Component extends DCLogic {
  renderVals() {
    const t = themeFor(this.props);
    return {
      t,
      headSize: t.retro ? 36 : 28,
      listRadius: t.retro ? 2 : 18,
      listBg: t.retro ? t.panel : t.bg,
      rowSize: t.retro ? 20 : 15,
      rowColor: t.retro ? t.lyric : t.text,
      outline: t.retro ? 'transparent' : t.edge,
      outlineBg: t.retro ? t.raised : 'transparent',
    };
  }
}
</script>
</body>
</html>
