substitutions:
  _REGION: us-central1
  _REPO: containers

steps:
  - name: gcr.io/cloud-builders/docker
    dir: workers/ytdlp-worker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ytdlp-worker:$SHORT_SHA
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ytdlp-worker:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
